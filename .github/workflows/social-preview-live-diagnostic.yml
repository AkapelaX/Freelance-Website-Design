name: Social Preview Live Diagnostic

on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Bluvixa and compare working AkapelaX preview
        shell: bash
        run: |
          set -u
          FB_UA='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          META_AGENT_UA='meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
          META_FETCHER_UA='meta-externalfetcher/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
          BROWSER_UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          probe_page() {
            url="$1"; ua="$2"; label="$3"
            echo
            echo "===== $label ====="
            rm -f /tmp/h /tmp/b
            curl -sS -L --max-time 30 -A "$ua" -D /tmp/h -o /tmp/b "$url" || true
            echo '--- HEADERS ---'
            sed -n '1,100p' /tmp/h || true
            echo "BODY_BYTES=$(wc -c </tmp/b 2>/dev/null || echo 0)"
            echo '--- SOCIAL META ---'
            grep -Eio '<(meta|link)[^>]+(og:|twitter:|canonical)[^>]*>|<title[^>]*>[^<]*</title>' /tmp/b | head -100 || true
            echo '--- FIRST IMAGES ---'
            grep -Eio '<img[^>]+>' /tmp/b | head -20 || true
            echo
          }

          probe_image() {
            ua="$1"; label="$2"; img='https://www.bluvixa.com/bluvixa-business-card-og-v7.jpg'
            echo
            echo "===== IMAGE $label GET ====="
            rm -f /tmp/ih /tmp/og.jpg
            curl -sS -L --max-time 30 -A "$ua" -D /tmp/ih -o /tmp/og.jpg "$img" || true
            sed -n '1,100p' /tmp/ih || true
            echo "IMAGE_BYTES=$(wc -c </tmp/og.jpg 2>/dev/null || echo 0)"
            file /tmp/og.jpg || true
            sha256sum /tmp/og.jpg || true
            echo "===== IMAGE $label HEAD ====="
            curl -sS -I -L --max-time 30 -A "$ua" "$img" || true
            echo "===== IMAGE $label RANGE ====="
            curl -sS -L --max-time 30 -A "$ua" -H 'Range: bytes=0-1023' -D - -o /tmp/range.bin "$img" || true
            echo "RANGE_BYTES=$(wc -c </tmp/range.bin 2>/dev/null || echo 0)"
          }

          echo '===== DNS BLUVIXA ====='
          getent ahosts bluvixa.com || true
          getent ahosts www.bluvixa.com || true

          probe_page 'https://bluvixa.com/' "$FB_UA" 'BLUVIXA FACEBOOK APEX'
          probe_page 'https://www.bluvixa.com/' "$FB_UA" 'BLUVIXA FACEBOOK WWW'
          probe_page 'https://www.bluvixa.com/' "$META_AGENT_UA" 'BLUVIXA META EXTERNAL AGENT'
          probe_page 'https://www.bluvixa.com/' "$META_FETCHER_UA" 'BLUVIXA META EXTERNAL FETCHER PAGE'
          probe_page 'https://www.bluvixa.com/' "$BROWSER_UA" 'BLUVIXA NORMAL BROWSER'

          probe_image "$FB_UA" 'FACEBOOKEXTERNALHIT'
          probe_image "$META_AGENT_UA" 'META-EXTERNALAGENT'
          probe_image "$META_FETCHER_UA" 'META-EXTERNALFETCHER'
          probe_image "$BROWSER_UA" 'BROWSER'

          echo
          echo '===== BLUVIXA ROBOTS ====='
          curl -sS -L --max-time 30 -A "$META_FETCHER_UA" -D - https://www.bluvixa.com/robots.txt | head -120 || true

          echo
          echo '===== WORKING SITE COMPARATOR: AKAPELAX.COM ====='
          getent ahosts akapelax.com || true
          getent ahosts www.akapelax.com || true
          probe_page 'https://akapelax.com/' "$FB_UA" 'AKAPELAX FACEBOOK APEX'
          probe_page 'https://www.akapelax.com/' "$FB_UA" 'AKAPELAX FACEBOOK WWW'
          probe_page 'https://akapelax.com/' "$META_AGENT_UA" 'AKAPELAX META EXTERNAL AGENT'
