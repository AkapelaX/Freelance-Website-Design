name: Promote Bluvixa OG Image to 1200x630

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate 1200x630 Open Graph image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path

          src = Path('bluvixa-business-card-og-v7.jpg')
          out = Path('bluvixa-business-card-og-v8.jpg')
          if not src.exists():
              raise SystemExit('Missing source OG image: ' + str(src))

          im = Image.open(src).convert('RGB')
          im.load()
          print('SOURCE_SIZE=', im.size)
          print('SOURCE_MODE=', im.mode)

          # Confirm the source is visually populated throughout the frame.
          w, h = im.size
          for name, box in {
              'top': (0, 0, w, max(1, h//3)),
              'middle': (0, h//3, w, max(h//3+1, 2*h//3)),
              'bottom': (0, 2*h//3, w, h),
          }.items():
              band = im.crop(box)
              stat = ImageStat.Stat(band)
              print(name.upper() + '_MEAN=', [round(x,2) for x in stat.mean])
              print(name.upper() + '_STDDEV=', [round(x,2) for x in stat.stddev])

          # Facebook/Meta's preferred large-link-preview canvas.
          target = im.resize((1200, 630), Image.Resampling.LANCZOS)
          target.save(out, 'JPEG', quality=92, optimize=True, progressive=False, subsampling=0)

          check = Image.open(out).convert('RGB')
          check.load()
          if check.size != (1200, 630):
              raise SystemExit(f'Unexpected output size: {check.size}')
          print('OUTPUT_SIZE=', check.size)
          print('OUTPUT_BYTES=', out.stat().st_size)
          PY

      - name: Point social metadata to fresh 1200x630 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('index.html'), Path('social-preview.html')]
          for p in paths:
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('bluvixa-business-card-og-v7.jpg', 'bluvixa-business-card-og-v8.jpg')
              s = s.replace('property="og:image:width" content="600"', 'property="og:image:width" content="1200"')
              s = s.replace('property="og:image:height" content="315"', 'property="og:image:height" content="630"')
              p.write_text(s)
          PY

      - name: Verify metadata and image before commit
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'og:image' index.html
          grep -n 'og:image:width' index.html
          grep -n 'og:image:height' index.html
          file bluvixa-business-card-og-v8.jpg
          test "$(python3 - <<'PY'
          from PIL import Image
          im=Image.open('bluvixa-business-card-og-v8.jpg')
          print(f'{im.width}x{im.height}')
          PY
          )" = "1200x630"

      - name: Commit production preview fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bluvixa-business-card-og-v8.jpg index.html
          if [ -f social-preview.html ]; then git add social-preview.html; fi
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use 1200x630 Bluvixa social preview image [skip ci]'
          git push origin HEAD:main
