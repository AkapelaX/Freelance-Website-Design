name: Social Preview Diagnostic

on:
  push:
    branches:
      - diagnostic-social-preview

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Deep probe live Bluvixa Facebook preview paths
        shell: bash
        run: |
          set -euo pipefail
          FB='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          FBCAT='facebookcatalog/1.0'
          FACEBOT='Facebot'
          META_AGENT='meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
          META_FETCH='meta-externalfetcher/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
          BROWSER='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          IMAGE='https://www.bluvixa.com/bluvixa-social-card-v10.jpg'

          probe_page() {
            url="$1"; ua="$2"; label="$3"
            echo
            echo "===== $label ====="
            rm -f /tmp/h /tmp/b
            curl -sS -L --max-time 30 -A "$ua" -D /tmp/h -o /tmp/b "$url"
            sed -n '1,160p' /tmp/h
            echo "BODY_BYTES=$(wc -c </tmp/b)"
            echo '--- META ---'
            grep -Eio '<meta[^>]+(fb:app_id|og:image|og:image:url|og:image:secure_url|og:image:width|og:image:height|og:image:type|og:title|og:description|og:url|og:type)[^>]*>' /tmp/b || true
            grep -Eio '<link[^>]+canonical[^>]*>' /tmp/b || true
          }

          echo '===== DNS ====='
          getent ahosts bluvixa.com || true
          getent ahosts www.bluvixa.com || true

          for pair in \
            "http://bluvixa.com/|$FB|FB HTTP APEX" \
            "http://www.bluvixa.com/|$FB|FB HTTP WWW" \
            "https://bluvixa.com/|$FB|FB HTTPS APEX" \
            "https://www.bluvixa.com/|$FB|FB HTTPS WWW" \
            "http://bluvixa.com/|$FBCAT|FBCATALOG HTTP APEX" \
            "https://www.bluvixa.com/|$FBCAT|FBCATALOG HTTPS WWW" \
            "https://www.bluvixa.com/|$FACEBOT|FACEBOT WWW" \
            "https://www.bluvixa.com/|$META_AGENT|META AGENT WWW" \
            "https://www.bluvixa.com/|$META_FETCH|META FETCHER WWW" \
            "https://www.bluvixa.com/|$BROWSER|BROWSER WWW"
          do
            IFS='|' read -r url ua label <<< "$pair"
            probe_page "$url" "$ua" "$label"
          done

          echo
          echo '===== RAW REDIRECTS ====='
          for u in http://bluvixa.com/ http://www.bluvixa.com/ https://bluvixa.com/; do
            echo "--- $u ---"
            curl -sS --max-time 30 -A "$FB" -D - -o /dev/null "$u"
          done

          echo
          echo '===== IMAGE GET ====='
          curl -sS -L --max-time 30 -A "$FB" -D /tmp/ih -o /tmp/og.jpg "$IMAGE"
          sed -n '1,120p' /tmp/ih
          file /tmp/og.jpg
          echo "IMAGE_BYTES=$(wc -c </tmp/og.jpg)"
          test "$(head -c 2 /tmp/og.jpg | xxd -p)" = 'ffd8'

          echo
          echo '===== IMAGE HEAD ====='
          curl -sS -I -L --max-time 30 -A "$FB" "$IMAGE"

          echo
          echo '===== IMAGE RANGE ====='
          curl -sS -L --max-time 30 -A "$FB" -H 'Range: bytes=0-1023' -D /tmp/rh -o /tmp/range "$IMAGE"
          sed -n '1,120p' /tmp/rh
          echo "RANGE_BYTES=$(wc -c </tmp/range)"

          echo
          echo '===== ROBOTS ====='
          curl -sS -L --max-time 30 -A "$FB" -D - https://www.bluvixa.com/robots.txt | head -160 || true

          echo
          echo '===== RESULT ====='
          echo SOCIAL_PREVIEW_DEEP_PROBE_OK=1
