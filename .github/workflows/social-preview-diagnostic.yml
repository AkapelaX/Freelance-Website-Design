name: Social Preview Diagnostic

on:
  push:
    branches:
      - diagnostic-social-preview

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final Facebook social object refresh
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          FB='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          META='meta-externalfetcher/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)'
          PAGE='https://www.bluvixa.com/'
          IMAGE='https://www.bluvixa.com/bluvixa-social-card-v10.jpg?v=11'
          OBJECT='https://www.bluvixa.com/?fb_preview=v11'

          for UA in "$FB" "$META"; do
            echo "===== PAGE $UA ====="
            curl -sS -L --max-time 30 -A "$UA" -D /tmp/ph -o /tmp/page "$PAGE"
            cat /tmp/ph
            grep -F '<meta property="fb:app_id" content="966242223397117"/>' /tmp/page
            grep -F "<meta property=\"og:url\" content=\"$OBJECT\"/>" /tmp/page
            grep -F "<meta property=\"og:image\" content=\"$IMAGE\"/>" /tmp/page
            grep -F '<meta property="og:image:width" content="1200"/>' /tmp/page
            grep -F '<meta property="og:image:height" content="630"/>' /tmp/page
          done

          echo '===== VERSIONED OBJECT ====='
          curl -sS -L --max-time 30 -A "$FB" -D /tmp/oh -o /tmp/object "$OBJECT"
          cat /tmp/oh
          grep -F '<meta property="fb:app_id" content="966242223397117"/>' /tmp/object
          grep -F "<meta property=\"og:url\" content=\"$OBJECT\"/>" /tmp/object

          echo '===== IMAGE ====='
          curl -sS -L --max-time 30 -A "$FB" -D /tmp/ih -o /tmp/og.jpg "$IMAGE"
          cat /tmp/ih
          test "$(head -c 2 /tmp/og.jpg | xxd -p)" = 'ffd8'
          file /tmp/og.jpg
          test "$(wc -c </tmp/og.jpg)" -gt 100000

          echo '===== ROBOTS ====='
          curl -sS -L --max-time 30 -A "$FB" -D /tmp/rh -o /tmp/robots https://www.bluvixa.com/robots.txt
          cat /tmp/rh
          cat /tmp/robots
          grep -qi 'facebookexternalhit' /tmp/robots
          grep -qi 'meta-externalfetcher' /tmp/robots

          echo FACEBOOK_SOCIAL_OBJECT_V11_OK=1
