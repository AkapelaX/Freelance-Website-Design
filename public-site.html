<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="index,follow"/>
<meta name="theme-color" content="#082b5e"/>
<title>Loading website…</title>
<meta name="description" content=""/>
<link href="hero-bluvixa-webicon.webp?v=5" rel="icon" type="image/webp"/>
<link href="assets/bluvixa-favicon.png?v=5" rel="apple-touch-icon"/>
<link href="style.css?v=20260729-preview-live-overlay" rel="stylesheet"/>
<style>
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body.public-site-body{margin:0;min-width:0;overflow-x:hidden;padding-top:0!important;background:#fff}
  .public-site-status{min-height:100vh;display:grid;place-items:center;padding:30px;background:#041023;color:#fff;text-align:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .public-site-status strong{display:block;font-size:clamp(1.8rem,5vw,3rem);margin-bottom:10px}
  .public-site-status p{margin:0;opacity:.8;font-size:1.05rem}
  #publicSiteRoot{width:100%;min-height:100vh}
  #publicSiteRoot.preview{max-width:none;width:100%;height:auto;min-height:100vh;border-radius:0;overflow:visible}
  #publicSiteRoot .site-header{top:0}
</style>
</head>
<body class="public-site-body">
<div class="public-site-status" id="loadingScreen">Loading website…</div>
<div class="public-site-status" id="notFoundScreen" hidden>
  <div>
    <strong>Website unavailable</strong>
    <p id="notFoundMessage">This website is not published.</p>
  </div>
</div>

<article class="preview" id="publicSiteRoot" hidden>
  <header class="site-header">
    <div class="site-brand-wrap">
      <div class="site-logo-frame" id="previewLogoFrame">
        <img alt="Business logo" id="previewLogoImage"/>
        <span id="previewLogoPlaceholder">YOUR LOGO</span>
      </div>
      <div class="site-brand" id="previewBusinessName"></div>
    </div>
    <button class="site-menu-toggle" id="previewMenuToggle" type="button" aria-label="Open website navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="previewSiteNav" aria-label="Website sections">
      <button type="button" data-preview-target="previewHero">Home</button>
      <button type="button" data-preview-target="previewAboutSection">About</button>
      <button type="button" data-preview-target="previewFeaturedSection">Services</button>
      <button type="button" data-preview-target="previewGallerySection">Display</button>
      <button type="button" data-preview-target="previewMapSection">Location</button>
    </nav>
    <a class="site-call" href="#" id="previewCallButton"></a>
  </header>

  <section class="site-hero" id="previewHero">
    <div class="site-hero-copy">
      <div class="kicker" id="previewTagline"></div>
      <h2 id="previewHeadline"></h2>
      <div class="bio-stack" id="previewHeaderBios"></div>
      <a class="hero-cta" href="#" id="previewHeroCall"></a>
    </div>
  </section>

  <section class="scroll-wrap">
    <div class="scroll-row" id="previewScroll"></div>
  </section>

  <section class="business cover-background preview-cover-section" id="previewAboutSection">
    <div>
      <h3 id="previewAboutHeading"></h3>
      <p id="previewBusinessBio"></p>
    </div>
    <div class="info">
      <div id="previewPhoneRow"><strong>Phone:</strong> <span id="previewPhone"></span></div>
      <div id="previewEmailRow"><strong>Email:</strong> <span id="previewEmail"></span></div>
      <div id="previewHoursRow"><strong>Hours:</strong> <span id="previewHours"></span></div>
      <div id="previewAddressRow"><strong>Location:</strong> <span id="previewAddress"></span></div>
    </div>
  </section>

  <section class="content-section cover-background preview-cover-section preview-upload-section" id="previewFeaturedSection">
    <div class="section-cover hidden" id="previewFeaturedCover" aria-hidden="true"></div>
    <div class="section-label">
      <div>
        <h3 id="previewFeaturedHeading"></h3>
        <p id="previewFeaturedDescription"></p>
      </div>
      <small id="previewPhotoCount" hidden></small>
    </div>
    <div class="cards preview-upload-grid" id="previewPhotoGrid"></div>
  </section>

  <section class="gallery-section cover-background preview-cover-section preview-upload-section" id="previewGallerySection">
    <div class="section-cover hidden" id="previewGalleryCover" aria-hidden="true"></div>
    <div class="section-label">
      <div>
        <h3 id="previewGalleryHeading"></h3>
        <p id="previewGalleryDescription"></p>
      </div>
      <small id="previewGalleryCount" hidden></small>
    </div>
    <div class="gallery-grid preview-upload-grid" id="previewGalleryGrid"></div>
  </section>

  <section class="map-section cover-background preview-cover-section" id="previewMapSection">
    <div class="map-copy">
      <h3 id="previewMapHeading"></h3>
      <p id="previewMapAddress"></p>
      <a class="hero-cta" href="#" id="previewMapCall"></a>
    </div>
    <iframe class="map-frame" id="previewMapFrame" title="Business location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </section>

  <footer class="site-footer">
    <span id="previewFooter"></span>
    <span>Website powered by Bluvixa</span>
  </footer>
</article>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const text = (value) => value == null ? "" : String(value).trim();
  const first = (...values) => values.map(text).find(Boolean) || "";
  const escapeHtml = (value) => String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
  const escapeAttr = escapeHtml;

  function showLoading() {
    $("loadingScreen").hidden = false;
    $("notFoundScreen").hidden = true;
    $("publicSiteRoot").hidden = true;
  }

  function showUnavailable(message) {
    $("loadingScreen").hidden = true;
    $("publicSiteRoot").hidden = true;
    $("notFoundScreen").hidden = false;
    $("notFoundMessage").textContent = message || "This website is not published.";
  }

  function showWebsite() {
    $("loadingScreen").hidden = true;
    $("notFoundScreen").hidden = true;
    $("publicSiteRoot").hidden = false;
  }

  function setText(id, value) {
    const node = $(id);
    if (node) node.textContent = value || "";
  }

  function applyBackground(node, url) {
    if (!node) return;
    const source = text(url);
    node.style.backgroundImage = source
      ? `linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),url("${source.replaceAll('"','\\"')}")`
      : "";
    node.classList.toggle("has-cover", Boolean(source));
  }

  function normalizeMapLocation(value, address) {
    let raw = text(value);
    if (/<iframe/i.test(raw)) {
      const match = raw.match(/\bsrc\s*=\s*["']([^"']+)["']/i);
      raw = match ? match[1] : "";
    }
    if (/google\.[^/]+\/maps\/embed/i.test(raw) || /[?&]output=embed(?:&|$)/i.test(raw)) return raw;
    return raw || text(address);
  }

  function normalizeItem(item) {
    item = item || {};
    return {
      url: first(item.url, item.src, item.file, item.mediaUrl, item.media_url),
      type: first(item.type, item.mime_type, item.mimeType),
      description: first(item.description, item.bio, item.caption),
      title: first(item.title, item.name, item.heading)
    };
  }

  function renderMediaGrid(id, items, cardClass) {
    const grid = $(id);
    if (!grid) return;
    const list = Array.isArray(items) ? items.map(normalizeItem).filter(item => item.url) : [];
    grid.innerHTML = list.map((item) => {
      const isVideo = item.type.toLowerCase().startsWith("video") || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(item.url);
      const media = isVideo
        ? `<video src="${escapeAttr(item.url)}" controls preload="metadata" playsinline></video>`
        : `<img src="${escapeAttr(item.url)}" alt="${escapeAttr(item.description || item.title || "Website upload")}">`;
      return `<article class="${cardClass}">${media}${item.description ? `<p>${escapeHtml(item.description)}</p>` : ""}</article>`;
    }).join("");
  }

  function getProjectData(project) {
    project = project || {};
    const candidate = project.data || project.state || project.builder_state || project.website_state || project.site_state || {};
    const nestedBusiness = candidate.business || {};
    const nestedHeader = candidate.header || project.header || {};
    const nestedDesign = candidate.design || project.site_settings || project.design || {};

    return {
      businessName: first(candidate.businessName, nestedBusiness.name, project.business_name, project.businessName, project.name, project.title),
      businessBio: first(candidate.businessBio, nestedBusiness.bio, project.business_bio, project.businessBio),
      phoneNumber: first(candidate.phoneNumber, nestedBusiness.phone, project.phone, project.phone_number),
      emailAddress: first(candidate.emailAddress, nestedBusiness.email, project.email, project.email_address),
      businessHours: first(candidate.businessHours, nestedBusiness.hours, project.business_hours, project.hours),
      businessAddress: first(candidate.businessAddress, nestedBusiness.address, project.address, project.business_address),
      callButtonText: first(candidate.callButtonText, nestedBusiness.callText, project.call_button_text, project.callText),
      headerTagline: first(candidate.headerTagline, nestedHeader.tagline, project.header_tagline),
      headerHeadline: first(candidate.headerHeadline, nestedHeader.headline, project.header_headline),
      headerImage: first(candidate.headerImage, nestedHeader.image, nestedHeader.image_url, project.header_image, project.header_image_url),
      headerBio: first(candidate.headerBio, nestedHeader.bio, project.header_bio),
      businessLogo: first(candidate.businessLogo, candidate.business_logo, nestedDesign.businessLogo, nestedDesign.logo, nestedBusiness.logo, project.business_logo, project.business_logo_url, project.logo, project.logo_url),
      aboutHeading: first(candidate.aboutHeading, nestedDesign.aboutHeading),
      aboutCover: first(candidate.aboutCover, nestedDesign.aboutCover),
      featuredHeading: first(candidate.featuredHeading, nestedDesign.featuredHeading, nestedDesign.latestUploadHeading),
      featuredDescription: first(candidate.featuredDescription, nestedDesign.featuredDescription, nestedDesign.latestUploadDescription),
      featuredCover: first(candidate.featuredCover, nestedDesign.featuredCover, nestedDesign.latestUploadCover),
      galleryHeading: first(candidate.galleryHeading, nestedDesign.galleryHeading),
      galleryDescription: first(candidate.galleryDescription, nestedDesign.galleryDescription),
      galleryCover: first(candidate.galleryCover, nestedDesign.galleryCover),
      mapHeading: first(candidate.mapHeading, nestedDesign.mapHeading),
      mapCover: first(candidate.mapCover, nestedDesign.mapCover, nestedDesign.contactCover),
      mapEmbedUrl: first(candidate.mapEmbedUrl, candidate.mapUrl, candidate.map_embed_url, nestedDesign.mapEmbedUrl, nestedDesign.mapUrl, project.map_embed_url, project.mapUrl),
      themeColor: first(candidate.themeColor, nestedDesign.themeColor, "#1769ff"),
      headerColor: first(candidate.headerColor, nestedDesign.headerColor, "#082b5e"),
      buttonColor: first(candidate.buttonColor, nestedDesign.buttonColor, "#1769ff"),
      cardColor: first(candidate.cardColor, nestedDesign.cardColor, "#ffffff"),
      cardTextColor: first(candidate.cardTextColor, nestedDesign.cardTextColor, "#000000"),
      logoOutlineColor: first(candidate.logoOutlineColor, nestedDesign.logoOutlineColor, "#61c7ff"),
      scrollItems: candidate.scrollItems != null ? candidate.scrollItems : (nestedDesign.scrollItems != null ? nestedDesign.scrollItems : nestedDesign.scroll),
      photos: Array.isArray(candidate.photos) ? candidate.photos : Array.isArray(candidate.featured) ? candidate.featured : Array.isArray(candidate.uploads) ? candidate.uploads : Array.isArray(project.content_cards) ? project.content_cards : [],
      gallery: Array.isArray(candidate.gallery) ? candidate.gallery : Array.isArray(candidate.galleryItems) ? candidate.galleryItems : Array.isArray(project.gallery_items) ? project.gallery_items : []
    };
  }

  function applyWebsite(project) {
    const d = getProjectData(project);
    const preview = $("publicSiteRoot");

    document.title = d.businessName || "Website";
    document.querySelector('meta[name="description"]').setAttribute("content", (d.businessBio || d.headerHeadline || d.businessName).slice(0,160));
    document.querySelector('meta[name="theme-color"]').setAttribute("content", d.headerColor);

    setText("previewBusinessName", d.businessName);
    setText("previewTagline", d.headerTagline);
    setText("previewHeadline", d.headerHeadline);
    setText("previewBusinessBio", d.businessBio);
    setText("previewPhone", d.phoneNumber);
    setText("previewEmail", d.emailAddress);
    setText("previewHours", d.businessHours);
    setText("previewAddress", d.businessAddress);
    setText("previewAboutHeading", d.aboutHeading);
    setText("previewFeaturedHeading", d.featuredHeading);
    $("previewFeaturedHeading").hidden = !text(d.featuredHeading);
    setText("previewFeaturedDescription", d.featuredDescription);
    setText("previewGalleryHeading", d.galleryHeading);
    $("previewGalleryHeading").hidden = !text(d.galleryHeading);
    setText("previewGalleryDescription", d.galleryDescription);
    setText("previewMapHeading", d.mapHeading);
    setText("previewMapAddress", d.businessAddress);
    setText("previewFooter", d.businessName);

    const callText = d.callButtonText || "Call Now";
    const tel = `tel:${String(d.phoneNumber || "").replace(/[^\d+]/g, "")}`;
    ["previewCallButton","previewHeroCall","previewMapCall"].forEach((id) => {
      const node = $(id);
      node.textContent = callText;
      node.href = tel;
      node.hidden = !d.phoneNumber;
    });

    $("previewHeaderBios").innerHTML = d.headerBio ? `<p>${escapeHtml(d.headerBio)}</p>` : "";

    applyBackground($("previewHero"), d.headerImage);
    applyBackground($("previewAboutSection"), d.aboutCover);
    applyBackground($("previewFeaturedSection"), d.featuredCover);
    applyBackground($("previewGallerySection"), d.galleryCover);
    applyBackground($("previewMapSection"), d.mapCover);

    const logoImage = $("previewLogoImage");
    const logoPlaceholder = $("previewLogoPlaceholder");
    if (d.businessLogo) {
      logoImage.src = d.businessLogo;
      logoImage.hidden = false;
      logoImage.style.display = "";
      logoPlaceholder.hidden = true;
      logoPlaceholder.style.display = "none";
      $("previewLogoFrame").classList.add("has-logo");
    } else {
      logoImage.removeAttribute("src");
      logoImage.hidden = true;
      logoImage.style.display = "none";
      logoPlaceholder.hidden = false;
      logoPlaceholder.style.display = "";
      $("previewLogoFrame").classList.remove("has-logo");
    }

    preview.style.setProperty("--site-theme", d.themeColor);
    preview.style.setProperty("--site-header", d.headerColor);
    preview.style.setProperty("--site-header-dark", d.headerColor);
    preview.style.setProperty("--site-button", d.buttonColor);
    preview.style.setProperty("--site-button-dark", d.buttonColor);
    preview.style.setProperty("--site-card", d.cardColor);
    preview.style.setProperty("--site-card-text", d.cardTextColor);
    preview.style.setProperty("--site-card-muted", d.cardTextColor);
    preview.style.setProperty("--card-color", d.cardColor);
    preview.style.setProperty("--card-text-color", d.cardTextColor);
    preview.style.setProperty("--site-logo-outline", d.logoOutlineColor);

    const scrollItems = Array.isArray(d.scrollItems)
      ? d.scrollItems
      : String(d.scrollItems || "").split(",");
    $("previewScroll").innerHTML = scrollItems.map(text).filter(Boolean).map(item => `<span class="scroll-chip">${escapeHtml(item)}</span>`).join("");
    $("previewScroll").closest(".scroll-wrap").hidden = !$("previewScroll").children.length;

    renderMediaGrid("previewPhotoGrid", d.photos, "card");
    renderMediaGrid("previewGalleryGrid", d.gallery, "gallery-card");
    setText("previewPhotoCount", `${d.photos.length} uploads`);
    setText("previewGalleryCount", `${d.gallery.length} uploads`);

    [
      ["previewPhoneRow", d.phoneNumber],
      ["previewEmailRow", d.emailAddress],
      ["previewHoursRow", d.businessHours],
      ["previewAddressRow", d.businessAddress]
    ].forEach(([id,value]) => { $(id).hidden = !value; });

    const mapLocation = normalizeMapLocation(d.mapEmbedUrl, d.businessAddress);
    $("previewMapFrame").src = mapLocation
      ? (/google\.[^/]+\/maps\/embed/i.test(mapLocation) || /[?&]output=embed(?:&|$)/i.test(mapLocation)
          ? mapLocation
          : `https://www.google.com/maps?q=${encodeURIComponent(mapLocation)}&output=embed`)
      : "about:blank";

    showWebsite();
  }

  window.BluvixaPublicSite = Object.freeze({ applyWebsite });

  async function start() {
    showLoading();
    const params = new URLSearchParams(location.search);
    if (params.get("preview") === "1") return;

    const pathMatch = location.pathname.match(/^\/site\/([^/?#]+)/i);
    const slug = params.get("slug") || (pathMatch ? decodeURIComponent(pathMatch[1]) : "");
    const hostname = location.hostname.toLowerCase();
    const host = params.get("host") || (!["bluvixa.com","www.bluvixa.com","localhost","127.0.0.1"].includes(hostname) ? hostname : "");

    if (!host && !slug) {
      showUnavailable("This website address is incomplete.");
      return;
    }

    const query = new URLSearchParams();
    if (host) query.set("host", host); else query.set("slug", slug);

    try {
      const response = await fetch(`/api/public-site?${query.toString()}`, {
        method: "GET",
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });
      let data = {};
      try { data = await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(data.error || "Website unavailable.");
      const website = data.site || data.website;
      if (!website) throw new Error("This website could not be found.");
      applyWebsite(website);
    } catch (error) {
      showUnavailable(error && error.message ? error.message : "This website is not published.");
    }
  }

  $("previewSiteNav").addEventListener("click", (event) => {
    const button = event.target.closest("[data-preview-target]");
    if (!button) return;
    const section = $(button.dataset.previewTarget);
    if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
    $("previewSiteNav").classList.remove("open");
    $("previewMenuToggle").setAttribute("aria-expanded", "false");
  });

  $("previewMenuToggle").addEventListener("click", () => {
    const nav = $("previewSiteNav");
    const open = nav.classList.toggle("open");
    $("previewMenuToggle").setAttribute("aria-expanded", String(open));
  });

  start();
})();
</script>
</body>
</html>
