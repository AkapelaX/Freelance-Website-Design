<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Loading website…</title>
<meta name="description" content="">
<link rel="stylesheet" href="/public-site.css?v=20260727-v100">
</head>
<body>
<div id="loadingScreen" class="loading-screen">Loading website…</div>
<main id="siteRoot" hidden>
<header class="site-header">
  <a class="brand" href="#home">
    <span class="logo-frame"><img id="logoImage" alt="" hidden><span id="logoFallback">B</span></span>
    <span><strong id="businessName">Your Business</strong><small id="tagline"></small></span>
  </a>
  <button id="menuButton" class="menu-button" type="button" aria-label="Open navigation">☰</button>
  <nav id="siteNav"></nav>
  <a id="headerCall" class="call-button" href="#">Call Now</a>
</header>

<section id="home" class="hero">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p id="headerBio" class="eyebrow"></p>
    <h1 id="headline">Build a stronger online presence.</h1>
    <p id="businessBio" class="lead"></p>
    <a id="heroCall" class="call-button large" href="#">Call Now</a>
  </div>
</section>

<section id="services" class="section info-section">
  <div class="section-inner">
    <div class="section-heading"><span>BUSINESS INFORMATION</span><h2>Get in touch</h2></div>
    <div class="info-card">
      <p><strong>Phone:</strong> <a id="phoneLink"></a></p>
      <p><strong>Email:</strong> <a id="emailLink"></a></p>
      <p><strong>Hours:</strong> <span id="hours"></span></p>
      <p><strong>Location:</strong> <span id="address"></span></p>
    </div>
  </div>
</section>

<section id="about" class="section cover-section" hidden>
  <div class="cover-bg" id="aboutCover"></div>
  <div class="section-inner">
    <div class="section-heading"><span>ABOUT</span><h2 id="aboutHeading"></h2></div>
    <div id="aboutText" class="content-card"></div>
  </div>
</section>

<section id="featured" class="section media-section" hidden>
  <div class="cover-bg" id="featuredCover"></div>
  <div class="section-inner">
    <div class="section-heading"><span>FEATURED</span><h2 id="featuredHeading"></h2><p id="featuredDescription"></p></div>
    <div id="photoGrid" class="media-grid"></div>
  </div>
</section>

<section id="gallery" class="section media-section" hidden>
  <div class="cover-bg" id="galleryCover"></div>
  <div class="section-inner">
    <div class="section-heading"><span>GALLERY</span><h2 id="galleryHeading"></h2><p id="galleryDescription"></p></div>
    <div id="galleryGrid" class="media-grid"></div>
  </div>
</section>

<section id="contact" class="section map-section" hidden>
  <div class="cover-bg" id="mapCover"></div>
  <div class="section-inner">
    <div class="section-heading"><span>LOCATION</span><h2 id="mapHeading"></h2></div>
    <div class="map-wrap"><iframe id="mapFrame" title="Business location" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <a id="mapCall" class="call-button large" href="#">Call Now</a>
  </div>
</section>

<footer><span id="footerText"></span><small>Built with Bluvixa</small></footer>
</main>
<script defer src="/public-site.js?v=20260727-v100"></script>
</body>
</html>
